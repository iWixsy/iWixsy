<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="top-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="50%" stop-color="#0A1326" />
      <stop offset="100%" stop-color="#060C18" />
    </linearGradient>

    <linearGradient id="node-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <linearGradient id="node-fw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1830" />
      <stop offset="100%" stop-color="#120e20" />
    </linearGradient>

    <linearGradient id="branch-srv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2238" />
      <stop offset="100%" stop-color="#081422" />
    </linearGradient>

    <linearGradient id="branch-cctv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262112" />
      <stop offset="100%" stop-color="#141109" />
    </linearGradient>

    <linearGradient id="branch-cli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2924" />
      <stop offset="100%" stop-color="#061714" />
    </linearGradient>

    <filter id="glow-cyan-top" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="packet-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes packet-down-1 {
        0% { stroke-dashoffset: 140; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packet-down-2 {
        0% { stroke-dashoffset: 180; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse-node {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      .trunk-anim {
        stroke-dasharray: 6, 12;
        animation: packet-down-1 2.5s linear infinite;
      }
      .branch-anim {
        stroke-dasharray: 5, 10;
        animation: packet-down-2 3s linear infinite;
      }
      .pulse-led { animation: pulse-node 1.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="950" height="560" rx="12" fill="url(#top-bg)" stroke="#1a2845" stroke-width="1.5" />

  <!-- Background Tech Grid -->
  <g opacity="0.08" stroke="#00D2FF" stroke-width="0.7">
    <line x1="0" y1="70" x2="950" y2="70" />
    <line x1="0" y1="140" x2="950" y2="140" />
    <line x1="0" y1="210" x2="950" y2="210" />
    <line x1="0" y1="280" x2="950" y2="280" />
    <line x1="0" y1="350" x2="950" y2="350" />
    <line x1="0" y1="420" x2="950" y2="420" />
    <line x1="0" y1="490" x2="950" y2="490" />
    
    <line x1="160" y1="0" x2="160" y2="560" />
    <line x1="320" y1="0" x2="320" y2="560" />
    <line x1="475" y1="0" x2="475" y2="560" />
    <line x1="630" y1="0" x2="630" y2="560" />
    <line x1="790" y1="0" x2="790" y2="560" />
  </g>

  <!-- Header Title -->
  <g transform="translate(30, 36)">
    <circle cx="8" cy="0" r="4" fill="#00D2FF" class="pulse-led" filter="url(#glow-cyan-top)" />
    <text x="22" y="5" fill="#FFFFFF" font-size="14" font-weight="700" class="font-mono" letter-spacing="1">NETWORK TOPOLOGY &amp; DATA FLOW ARCHITECTURE</text>
    <text x="690" y="5" fill="#64748B" font-size="10" class="font-mono">TOPOLOGY: ENTERPRISE HUB &amp; SPOKE</text>
  </g>

  <!-- ================= TOPOLOGY NODES & TRUNKS ================= -->

  <!-- FIBER / NETWORK TRUNK WIRES -->
  <!-- 1. Internet to Firewall -->
  <line x1="475" y1="100" x2="475" y2="135" stroke="#1e345b" stroke-width="3" />
  <line x1="475" y1="100" x2="475" y2="135" stroke="#00D2FF" stroke-width="2" class="trunk-anim" />

  <!-- 2. Firewall to Cisco Router -->
  <line x1="475" y1="185" x2="475" y2="220" stroke="#1e345b" stroke-width="3" />
  <line x1="475" y1="185" x2="475" y2="220" stroke="#00D2FF" stroke-width="2" class="trunk-anim" />

  <!-- 3. Cisco Router to Core Switch -->
  <line x1="475" y1="270" x2="475" y2="305" stroke="#1e345b" stroke-width="3" />
  <line x1="475" y1="270" x2="475" y2="305" stroke="#00FF88" stroke-width="2" class="trunk-anim" />

  <!-- 4. Core Switch Distribution Bus -->
  <!-- Horizontal Distribution Line -->
  <path d="M 175 390 L 175 355 L 775 355 L 775 390" fill="none" stroke="#1e345b" stroke-width="3" />
  <!-- Central drop to Core Switch -->
  <line x1="475" y1="345" x2="475" y2="390" stroke="#1e345b" stroke-width="3" />

  <!-- Animated Branches -->
  <path d="M 475 345 L 475 355 L 175 355 L 175 390" fill="none" stroke="#38BDF8" stroke-width="2" class="branch-anim" />
  <line x1="475" y1="345" x2="475" y2="390" stroke="#F59E0B" stroke-width="2" class="branch-anim" />
  <path d="M 475 345 L 475 355 L 775 355 L 775 390" fill="none" stroke="#10B981" stroke-width="2" class="branch-anim" />


  <!-- ================= NODE 1: INTERNET / WAN ================= -->
  <g transform="translate(365, 55)">
    <rect width="220" height="45" rx="8" fill="url(#node-box)" stroke="#0078D4" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#0078D4" />
    <text x="36" y="20" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">WAN GATEWAY / ISP</text>
    <text x="36" y="34" fill="#64748B" font-size="9" class="font-mono">BGP Uplink • Fiber Backbone</text>
    <circle cx="200" cy="22" r="3" fill="#00FF88" class="pulse-led" />
  </g>

  <!-- ================= NODE 2: FIREWALL (pfSense) ================= -->
  <g transform="translate(355, 135)">
    <rect width="240" height="50" rx="8" fill="url(#node-fw)" stroke="#E11D48" stroke-width="1.2" />
    <!-- Shield Icon Accent -->
    <rect x="14" y="13" width="24" height="24" rx="4" fill="#4c0519" stroke="#FB7185" stroke-width="1" />
    <text x="22" y="30" fill="#FB7185" font-size="12" font-weight="900" class="font-mono">🛡</text>
    <text x="48" y="25" fill="#FDA4AF" font-size="12" font-weight="700" class="font-mono">pfSense / NEXT-GEN FW</text>
    <text x="48" y="40" fill="#94A3B8" font-size="9" class="font-mono">Stateful Inspection • NAT • VPN IPsec</text>
    <circle cx="222" cy="25" r="3.5" fill="#00FF88" class="pulse-led" />
  </g>

  <!-- ================= NODE 3: CISCO CORE ROUTER ================= -->
  <g transform="translate(345, 220)">
    <rect width="260" height="50" rx="8" fill="url(#node-box)" stroke="#00D2FF" stroke-width="1.2" />
    <rect x="14" y="13" width="24" height="24" rx="4" fill="#092540" stroke="#00D2FF" stroke-width="1" />
    <text x="20" y="29" fill="#00D2FF" font-size="12" font-weight="900" class="font-mono">⚡</text>
    <text x="48" y="25" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mono">CISCO CORE ROUTER</text>
    <text x="48" y="40" fill="#94A3B8" font-size="9" class="font-mono">OSPF • Inter-VLAN Routing • QoS • ACLs</text>
    <circle cx="242" cy="25" r="3.5" fill="#00D2FF" class="pulse-led" />
  </g>

  <!-- ================= NODE 4: CORE DISTRIBUTION SWITCH (L3) ================= -->
  <g transform="translate(335, 305)">
    <rect width="280" height="48" rx="8" fill="url(#node-box)" stroke="#00FF88" stroke-width="1.2" />
    <rect x="14" y="12" width="24" height="24" rx="4" fill="#062e1c" stroke="#00FF88" stroke-width="1" />
    <text x="20" y="28" fill="#00FF88" font-size="12" font-weight="900" class="font-mono">🔀</text>
    <text x="48" y="24" fill="#E2E8F0" font-size="12" font-weight="700" class="font-mono">CORE SWITCH (LAYER 3)</text>
    <text x="48" y="38" fill="#94A3B8" font-size="9" class="font-mono">10G SFP+ Trunk • LACP • 802.1Q VLANs</text>
    <circle cx="262" cy="24" r="3.5" fill="#00FF88" class="pulse-led" />
  </g>


  <!-- ================= BRANCH 1: ENTERPRISE SERVERS ================= -->
  <g transform="translate(40, 390)">
    <rect width="270" height="145" rx="8" fill="url(#branch-srv)" stroke="#38BDF8" stroke-width="1.2" />
    
    <!-- Branch Header -->
    <rect x="10" y="10" width="250" height="26" rx="4" fill="#08182b" stroke="#1b3659" stroke-width="0.8" />
    <circle cx="22" cy="23" r="3.5" fill="#38BDF8" />
    <text x="32" y="27" fill="#38BDF8" font-size="10" font-weight="700" class="font-mono">ENTERPRISE SERVERS (VLAN 50)</text>

    <!-- Content Items -->
    <g transform="translate(14, 48)">
      <circle cx="6" cy="7" r="2.5" fill="#00FF88" />
      <text x="16" y="10" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">Debian 12 &amp; Ubuntu Server</text>
      <text x="16" y="22" fill="#64748B" font-size="8.5" class="font-mono">Core Infrastructure &amp; DNS/DHCP</text>

      <circle cx="6" cy="37" r="2.5" fill="#00FF88" />
      <text x="16" y="40" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">Windows Server 2022</text>
      <text x="16" y="52" fill="#64748B" font-size="8.5" class="font-mono">Active Directory, Group Policy, Files</text>

      <circle cx="6" cy="67" r="2.5" fill="#00D2FF" />
      <text x="16" y="70" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">Docker Containers &amp; Microservices</text>
      <text x="16" y="82" fill="#64748B" font-size="8.5" class="font-mono">Isolated Apps &amp; Automation Daemons</text>
    </g>
  </g>


  <!-- ================= BRANCH 2: PORT FACILITY INFRASTRUCTURE ================= -->
  <g transform="translate(340, 390)">
    <rect width="270" height="145" rx="8" fill="url(#branch-cctv)" stroke="#F59E0B" stroke-width="1.2" />
    
    <!-- Branch Header -->
    <rect x="10" y="10" width="250" height="26" rx="4" fill="#211806" stroke="#4a3710" stroke-width="0.8" />
    <circle cx="22" cy="23" r="3.5" fill="#F59E0B" />
    <text x="32" y="27" fill="#F59E0B" font-size="10" font-weight="700" class="font-mono">PORT FACILITY INFRA (VLAN 60)</text>

    <!-- Content Items -->
    <g transform="translate(14, 48)">
      <circle cx="6" cy="7" r="2.5" fill="#F59E0B" />
      <text x="16" y="10" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">Fiber Optic Backbone (OTDR)</text>
      <text x="16" y="22" fill="#64748B" font-size="8.5" class="font-mono">Long-Range Single-Mode Trunks</text>

      <circle cx="6" cy="37" r="2.5" fill="#00FF88" />
      <text x="16" y="40" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">CCTV Security &amp; NVR VMS</text>
      <text x="16" y="52" fill="#64748B" font-size="8.5" class="font-mono">PoE IP Cameras &amp; Video Streams</text>

      <circle cx="6" cy="67" r="2.5" fill="#F59E0B" />
      <text x="16" y="70" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">Industrial Rugged APs &amp; Radios</text>
      <text x="16" y="82" fill="#64748B" font-size="8.5" class="font-mono">Field Terminal &amp; Crane Coverage</text>
    </g>
  </g>


  <!-- ================= BRANCH 3: ENTERPRISE WORKSTATIONS & MANAGEMENT ================= -->
  <g transform="translate(640, 390)">
    <rect width="270" height="145" rx="8" fill="url(#branch-cli)" stroke="#10B981" stroke-width="1.2" />
    
    <!-- Branch Header -->
    <rect x="10" y="10" width="250" height="26" rx="4" fill="#082119" stroke="#124738" stroke-width="0.8" />
    <circle cx="22" cy="23" r="3.5" fill="#10B981" />
    <text x="32" y="27" fill="#10B981" font-size="10" font-weight="700" class="font-mono">MANAGEMENT &amp; USERS (VLAN 10-30)</text>

    <!-- Content Items -->
    <g transform="translate(14, 48)">
      <circle cx="6" cy="7" r="2.5" fill="#10B981" />
      <text x="16" y="10" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">VLAN 10: IT &amp; Admin Ops</text>
      <text x="16" y="22" fill="#64748B" font-size="8.5" class="font-mono">SSH, RDP, Telnet &amp; Console Access</text>

      <circle cx="6" cy="37" r="2.5" fill="#00FF88" />
      <text x="16" y="40" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">VLAN 20: Operations &amp; Staff</text>
      <text x="16" y="52" fill="#64748B" font-size="8.5" class="font-mono">Enterprise Workstations &amp; Printers</text>

      <circle cx="6" cy="67" r="2.5" fill="#38BDF8" />
      <text x="16" y="70" fill="#E2E8F0" font-size="10" font-weight="600" class="font-sans">VLAN 30: Isolated Guest Portal</text>
      <text x="16" y="82" fill="#64748B" font-size="8.5" class="font-mono">Captive Portal &amp; Strict Bandwidth Cap</text>
    </g>
  </g>
</svg>