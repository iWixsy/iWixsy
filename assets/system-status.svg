<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 105" width="100%" height="100%">
  <defs>
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1b" />
      <stop offset="100%" stop-color="#0d182e" />
    </linearGradient>
    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0078D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .live-dot { animation: pulse 1.8s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="950" height="105" rx="8" fill="url(#hud-bg)" stroke="url(#hud-border)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 10 20 L 10 10 L 20 10" stroke="#00D2FF" stroke-width="1.5" fill="none" />
  <path d="M 940 20 L 940 10 L 930 10" stroke="#00D2FF" stroke-width="1.5" fill="none" />
  <path d="M 10 85 L 10 95 L 20 95" stroke="#00D2FF" stroke-width="1.5" fill="none" />
  <path d="M 940 85 L 940 95 L 930 95" stroke="#00D2FF" stroke-width="1.5" fill="none" />

  <!-- Header Section -->
  <g transform="translate(25, 26)">
    <circle cx="6" cy="0" r="4" fill="#00FF88" class="live-dot" />
    <text x="18" y="4" fill="#00D2FF" font-size="12" font-weight="700" class="font-mono" letter-spacing="1.5">SYSTEM TELEMETRY &amp; INFRASTRUCTURE STATUS</text>
    <text x="730" y="4" fill="#64748B" font-size="10" font-weight="600" class="font-mono">UPTIME: 99.98% • LATENCY: &lt;1ms</text>
  </g>

  <!-- Grid Items -->
  <g transform="translate(25, 48)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="210" height="42" rx="4" fill="#060c18" stroke="#1c2d4a" stroke-width="1" />
    <text x="12" y="17" fill="#64748B" font-size="9" font-weight="600" class="font-mono">NETWORK BACKBONE</text>
    <text x="12" y="32" fill="#00FF88" font-size="11" font-weight="700" class="font-mono">ONLINE • 10G SFP+ FIBER</text>

    <!-- Box 2 -->
    <rect x="225" y="0" width="220" height="42" rx="4" fill="#060c18" stroke="#1c2d4a" stroke-width="1" />
    <text x="12" y="17" fill="#64748B" font-size="9" font-weight="600" class="font-mono">FIREWALL &amp; SECURITY</text>
    <text x="12" y="32" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">pfSense • ACTIVE IDS/IPS</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="220" height="42" rx="4" fill="#060c18" stroke="#1c2d4a" stroke-width="1" />
    <text x="12" y="17" fill="#64748B" font-size="9" font-weight="600" class="font-mono">SYSTEM PLATFORMS</text>
    <text x="12" y="32" fill="#00D2FF" font-size="11" font-weight="700" class="font-mono">LINUX / DEBIAN / WIN SRV</text>

    <!-- Box 4 -->
    <rect x="695" y="0" width="205" height="42" rx="4" fill="#060c18" stroke="#1c2d4a" stroke-width="1" />
    <text x="12" y="17" fill="#64748B" font-size="9" font-weight="600" class="font-mono">AUTOMATION STATUS</text>
    <text x="12" y="32" fill="#F59E0B" font-size="11" font-weight="700" class="font-mono">DOCKER • BASH ACTIVE</text>
  </g>
</svg>