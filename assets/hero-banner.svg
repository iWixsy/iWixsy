<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accent-box-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 210, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 120, 212, 0.05)" />
    </linearGradient>

    <linearGradient id="server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f36" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>

    <linearGradient id="rack-unit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b2845" />
      <stop offset="100%" stop-color="#131c31" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse-led {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes pulse-fast {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes flow-packet {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .led-green { animation: pulse-led 2s infinite ease-in-out; }
      .led-cyan { animation: pulse-fast 1.4s infinite ease-in-out; }
      .led-blue { animation: pulse-led 2.8s infinite ease-in-out; }
      .packet-line {
        stroke-dasharray: 8, 14;
        animation: flow-packet 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="14" fill="url(#bg-grad)" stroke="#1a2640" stroke-width="1.5" />

  <!-- Cyber Grid Background -->
  <g opacity="0.1" stroke="#00D2FF" stroke-width="0.75">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Circuit / Fiber Traces -->
  <g stroke="#0078D4" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M 50 320 L 50 250 L 120 180 L 260 180" />
    <path d="M 680 0 L 680 90 L 760 170 L 980 170" />
    <path d="M 400 320 L 480 240 L 620 240" />
  </g>
  
  <!-- Active Animated Fiber Lines -->
  <path d="M 40 280 L 180 280 L 240 220 L 550 220" fill="none" stroke="#00D2FF" stroke-width="1.5" class="packet-line" opacity="0.6" />
  <path d="M 640 60 L 750 60 L 820 130 L 960 130" fill="none" stroke="#38BDF8" stroke-width="1.5" class="packet-line" opacity="0.6" />

  <!-- Corner Tech Accents -->
  <path d="M 14 30 L 14 14 L 30 14" stroke="#00D2FF" stroke-width="2" fill="none" />
  <path d="M 986 30 L 986 14 L 970 14" stroke="#00D2FF" stroke-width="2" fill="none" />
  <path d="M 14 290 L 14 306 L 30 306" stroke="#00D2FF" stroke-width="2" fill="none" />
  <path d="M 986 290 L 986 306 L 970 306" stroke="#00D2FF" stroke-width="2" fill="none" />

  <!-- ================= LEFT CONTENT AREA ================= -->
  
  <!-- Status Badge -->
  <g transform="translate(60, 42)">
    <rect width="280" height="26" rx="6" fill="url(#accent-box-grad)" stroke="#00D2FF" stroke-width="1" opacity="0.8" />
    <circle cx="14" cy="13" r="4" fill="#00FF88" class="led-green" filter="url(#subtle-glow)" />
    <text x="26" y="17" fill="#E2E8F0" font-size="11" font-weight="600" class="font-mono" letter-spacing="1">DIGITAL INFRASTRUCTURE PROFILE</text>
  </g>

  <!-- Name Header -->
  <text x="60" y="122" fill="#FFFFFF" font-size="44" font-weight="800" class="font-sans" letter-spacing="1.5">
    BATUHAN <tspan fill="url(#cyan-blue-grad)">ERKAN</tspan>
  </text>

  <!-- Primary Identity Badge -->
  <g transform="translate(60, 142)">
    <rect width="260" height="32" rx="6" fill="#0078D4" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1.2" />
    <text x="16" y="21" fill="#00D2FF" font-size="14" font-weight="700" class="font-mono" letter-spacing="2">NETWORK &amp; SYSTEMS</text>
  </g>

  <!-- Subtitle / Focus Areas -->
  <text x="60" y="202" fill="#94A3B8" font-size="13" font-weight="500" class="font-mono" letter-spacing="0.5">
    IT INFRASTRUCTURE • LINUX • NETWORKING • SERVER MANAGEMENT
  </text>

  <!-- Lower Telemetry Bar -->
  <g transform="translate(60, 235)">
    <rect width="520" height="42" rx="6" fill="#0c1527" stroke="#1e2c4a" stroke-width="1" />
    
    <!-- Item 1 -->
    <text x="16" y="25" fill="#64748B" font-size="10" font-weight="600" class="font-mono">DOMAIN:</text>
    <text x="68" y="25" fill="#38BDF8" font-size="11" font-weight="600" class="font-mono">ENTERPRISE IT</text>
    
    <line x1="165" y1="10" x2="165" y2="32" stroke="#1e2c4a" stroke-width="1" />

    <!-- Item 2 -->
    <text x="180" y="25" fill="#64748B" font-size="10" font-weight="600" class="font-mono">SECURITY:</text>
    <text x="245" y="25" fill="#00FF88" font-size="11" font-weight="600" class="font-mono">STATEFUL / FW</text>

    <line x1="345" y1="10" x2="345" y2="32" stroke="#1e2c4a" stroke-width="1" />

    <!-- Item 3 -->
    <text x="360" y="25" fill="#64748B" font-size="10" font-weight="600" class="font-mono">PIPELINE:</text>
    <text x="425" y="25" fill="#F59E0B" font-size="11" font-weight="600" class="font-mono">DOCKER / BASH</text>
  </g>

  <!-- ================= RIGHT ILLUSTRATION: 3D SERVER RACK & TOPOLOGY ================= -->
  <g transform="translate(660, 30)">
    <!-- Background Glow Aura -->
    <circle cx="150" cy="130" r="110" fill="#0078D4" opacity="0.15" filter="url(#glow-cyan)" />
    
    <!-- Server Rack Frame 3D -->
    <polygon points="120,30 220,30 250,55 150,55" fill="#1b2a47" stroke="#00D2FF" stroke-width="1" />
    <polygon points="220,30 250,55 250,225 220,200" fill="#0e1728" stroke="#1e2d4d" stroke-width="1" />
    <rect x="70" y="55" width="150" height="170" rx="4" fill="url(#server-grad)" stroke="#00D2FF" stroke-width="1.2" />

    <!-- Server Rack Header / Brand Plate -->
    <rect x="76" y="61" width="138" height="14" rx="2" fill="#0f192d" stroke="#1c2e50" stroke-width="0.8" />
    <circle cx="85" cy="68" r="2" fill="#00D2FF" class="led-cyan" />
    <text x="94" y="72" fill="#94A3B8" font-size="7" font-weight="700" class="font-mono" letter-spacing="1">RACK-CORE-01</text>
    <circle cx="205" cy="68" r="2.5" fill="#00FF88" class="led-green" />

    <!-- Rack Unit 1: Cisco Core Router -->
    <g transform="translate(76, 80)">
      <rect width="138" height="22" rx="2" fill="url(#rack-unit-grad)" stroke="#22365c" stroke-width="0.8" />
      <text x="6" y="14" fill="#00D2FF" font-size="8" font-weight="700" class="font-mono">ROUTER-L3</text>
      <rect x="68" y="7" width="8" height="8" rx="1" fill="#090f1c" stroke="#00D2FF" stroke-width="0.6" />
      <rect x="78" y="7" width="8" height="8" rx="1" fill="#090f1c" stroke="#00D2FF" stroke-width="0.6" />
      <rect x="88" y="7" width="8" height="8" rx="1" fill="#090f1c" stroke="#00D2FF" stroke-width="0.6" />
      <rect x="98" y="7" width="8" height="8" rx="1" fill="#090f1c" stroke="#00D2FF" stroke-width="0.6" />
      <circle cx="114" cy="11" r="2" fill="#00FF88" class="led-green" />
      <circle cx="121" cy="11" r="2" fill="#00D2FF" class="led-cyan" />
      <circle cx="128" cy="11" r="2" fill="#38BDF8" class="led-blue" />
    </g>

    <!-- Rack Unit 2: Distribution Switch (24-Port) -->
    <g transform="translate(76, 106)">
      <rect width="138" height="22" rx="2" fill="url(#rack-unit-grad)" stroke="#22365c" stroke-width="0.8" />
      <text x="6" y="14" fill="#38BDF8" font-size="8" font-weight="700" class="font-mono">CORE-SW-01</text>
      <line x1="68" y1="8" x2="116" y2="8" stroke="#00D2FF" stroke-width="2" stroke-dasharray="3,2" />
      <line x1="68" y1="14" x2="116" y2="14" stroke="#00D2FF" stroke-width="2" stroke-dasharray="3,2" />
      <circle cx="125" cy="11" r="2" fill="#00FF88" class="led-green" />
      <circle cx="131" cy="11" r="2" fill="#00FF88" class="led-green" />
    </g>

    <!-- Rack Unit 3: Debian / Linux Server Node -->
    <g transform="translate(76, 132)">
      <rect width="138" height="26" rx="2" fill="url(#rack-unit-grad)" stroke="#22365c" stroke-width="0.8" />
      <text x="6" y="16" fill="#F87171" font-size="8" font-weight="700" class="font-mono">DEBIAN-SRV</text>
      <rect x="68" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="73" cy="16" r="1.2" fill="#00D2FF" class="led-cyan" />
      <rect x="80" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="85" cy="16" r="1.2" fill="#00FF88" class="led-green" />
      <rect x="92" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="97" cy="16" r="1.2" fill="#00FF88" class="led-green" />
      <rect x="104" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="109" cy="16" r="1.2" fill="#00D2FF" class="led-cyan" />
      <circle cx="124" cy="13" r="2" fill="#00FF88" class="led-green" />
      <circle cx="130" cy="13" r="2" fill="#F59E0B" class="led-cyan" />
    </g>

    <!-- Rack Unit 4: Windows Server & Container Host -->
    <g transform="translate(76, 162)">
      <rect width="138" height="26" rx="2" fill="url(#rack-unit-grad)" stroke="#22365c" stroke-width="0.8" />
      <text x="6" y="16" fill="#60A5FA" font-size="8" font-weight="700" class="font-mono">WIN-SRV-22</text>
      <rect x="68" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="73" cy="16" r="1.2" fill="#00FF88" class="led-green" />
      <rect x="80" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="85" cy="16" r="1.2" fill="#00FF88" class="led-green" />
      <rect x="92" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="97" cy="16" r="1.2" fill="#00D2FF" class="led-cyan" />
      <rect x="104" y="6" width="10" height="14" rx="1" fill="#0b1322" stroke="#1d2e4e" />
      <circle cx="109" cy="16" r="1.2" fill="#00FF88" class="led-green" />
      <circle cx="126" cy="13" r="2.5" fill="#00D2FF" class="led-cyan" />
    </g>

    <!-- Rack Unit 5: UPS & Power Distribution -->
    <g transform="translate(76, 192)">
      <rect width="138" height="26" rx="2" fill="#0b1220" stroke="#1c2c4a" stroke-width="0.8" />
      <text x="6" y="16" fill="#10B981" font-size="8" font-weight="700" class="font-mono">SMART-UPS</text>
      <text x="74" y="16" fill="#00FF88" font-size="9" font-weight="600" class="font-mono">230V [OK]</text>
      <circle cx="128" cy="13" r="2" fill="#00FF88" class="led-green" />
    </g>

    <!-- Fiber Patch Cables -->
    <path d="M 148 93 Q 170 100 178 118" fill="none" stroke="#00D2FF" stroke-width="1.2" opacity="0.8" />
    <path d="M 158 93 Q 185 110 188 144" fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.8" />
    <path d="M 166 118 Q 195 140 188 174" fill="none" stroke="#00FF88" stroke-width="1.2" opacity="0.8" />

    <!-- External Satellite Labels -->
    <g transform="translate(18, 100)">
      <circle cx="0" cy="0" r="14" fill="#0d182b" stroke="#00D2FF" stroke-width="1.2" />
      <text x="-8" y="4" fill="#00D2FF" font-size="9" class="font-mono">WAN</text>
      <line x1="14" y1="0" x2="58" y2="-10" stroke="#00D2FF" stroke-width="1" stroke-dasharray="2,2" />
    </g>

    <g transform="translate(18, 170)">
      <circle cx="0" cy="0" r="14" fill="#0d182b" stroke="#38BDF8" stroke-width="1.2" />
      <text x="-8" y="4" fill="#38BDF8" font-size="9" class="font-mono">LAN</text>
      <line x1="14" y1="0" x2="58" y2="-30" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,2" />
    </g>
  </g>
</svg>